name: delivery_app
description: Delivery — توصيل من محلات مدينتك (تطبيق الزبون)
publish_to: 'none'
version: 4.1.0+41

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  shared_preferences: any
  flutter_map: '>=7.0.0 <9.0.0'
  latlong2: any
  geolocator: '>=12.0.0 <15.0.0'
  url_launcher: any
  image_picker: any
  image: ^4.1.0
  flutter_local_notifications: '>=22.0.0 <23.0.0'

dev_dependencies:
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: '#C2410C'
  adaptive_icon_foreground: assets/icon_fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  # الخطوط مضمّنة في التطبيق: تظهر صحيحة من أول تشغيل ولو بلا إنترنت
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-600.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-700.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-800.ttf
          weight: 800
